# Site settings
title: Alamo Tech Collective - San Antonio's Tech Community
email: ""
description: >-
  San Antonio's grassroots tech community. Meetups, build nights, and workshops
  for developers, security folks, and digital creators. Come build with us.
tagline: "Where San Antonio's Tech Community Collaborates and Innovates"
locale: "en_US"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://alamotechcollective.com" # the base hostname & protocol for your site
github_username: alamo-tech-collective

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Collections
collections:
  pages:
    output: true
    permalink: /:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - scripts/